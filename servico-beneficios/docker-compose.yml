services:
  postgres:
    image: postgres
    container_name: postgres_beneficios
    env_file:
      - .env
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    networks:
      - shared_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data



  api:
    build:
      context: . # pasta que contém o Dockerfile
    container_name: beneficios-api
    env_file:
      - .env
    ports:
      - "8087:8087"
    networks:
      - shared_network

    depends_on:
        postgres:
          condition: service_healthy


    environment:
      DATASOURCE_URL: ${DATASOURCE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}




networks:
  shared_network:
    external: true


volumes:
  postgres_data:


