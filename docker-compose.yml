services:
  postgres:
    image: postgres
    container_name: postgres_beneficios
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data



  api-beneficios:
    build:
      context: ./servico-beneficios   # pasta que contém o Dockerfile
    ports:
      - "8087:8087"
    depends_on:
      - postgres



volumes:
  postgres_data:


